                - generic [ref=e165]: "1. GST/HSN Classification: Rudraksha, Malas & Hampers"
                - generic [ref=e170]: Tax Ambiguity
              - paragraph [ref=e171]:
                - strong [ref=e172]: "Statutory Conflict:"
                - text: Raw botanical seeds (HSN 9602 / 1211) enjoy agricultural/handicraft exemptions, whereas silver/gold-capped malas and mixed hampers fall under Precious Jewellery (HSN 7113 / 7117) attracting 3% GST.
              - generic [ref=e173]:
                - strong [ref=e174]: "Standard Operational Ruling:"
                - text: All consecrated malas and corporate hampers containing precious components are invoiced under unified 3% GST (HSN 7117 / 7113) with itemized component valuations to prevent tax classification disputes.
            - generic [ref=e175]:
              - generic [ref=e176]:
                - generic [ref=e177]: 2. Cash-on-Delivery (COD) Statutory Prohibition
                - generic [ref=e182]: PMLA Rule
              - paragraph [ref=e183]:
                - strong [ref=e184]: "PMLA & Courier Mandate:"
                - text: Under the Prevention of Money Laundering Act (PMLA) 2002 and RBI high-value transaction guidelines, cash settlements for un-assayed deliveries pose severe anti-money laundering and courier transit hijacking exposure.
              - generic [ref=e185]:
                - strong [ref=e186]: "Standard Operational Ruling:"
                - text: COD is permanently disabled storewide for precious bullion, coins, and jewellery above ₹10,000. All orders must complete 100% advance digital settlement via RTGS, NetBanking, or UPI.
            - generic [ref=e187]:
              - generic [ref=e188]:
                - generic [ref=e189]: 3. Bullion Returns & Volatility Risk Buyback Protocol
                - generic [ref=e193]: Market Exemption
              - paragraph [ref=e194]:
                - strong [ref=e195]: "Consumer Protection Exemption:"
                - text: Standard statutory 7-day "no-questions" e-commerce returns cannot apply to investment-grade bullion due to continuous intraday spot market price fluctuations (Consumer Protection Rules 2020, Rule 5).
              - generic [ref=e196]:
                - strong [ref=e197]: "Standard Operational Ruling:"
                - text: Orders are non-cancellable once payment is confirmed. Post-delivery returns are routed through our Guaranteed Lifetime Buyback Protocol based on prevailing live spot rates less refining spread.
            - generic [ref=e198]:
              - generic [ref=e199]:
                - generic [ref=e200]: 4. Statutory Disclosures in Additional Vernacular Languages
                - generic [ref=e205]: Phase 11 Sprint
              - paragraph [ref=e206]:
                - strong [ref=e207]: "Consumer Rights Provision:"
                - text: The Consumer Protection Act 2019 stipulates that mandatory weight disclosures, BIS hallmarking guides, and consumer grievance contact points be available in prominent regional languages.
              - generic [ref=e208]:
